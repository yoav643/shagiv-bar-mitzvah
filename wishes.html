<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a2744" />
  <title>ברכות מהאורחים · שגיב</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#1a2744;--gold:#c9a227;--cream:#f7f1e4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(ellipse at top,#2c3d62,#1a2744 55%,#10182a);font-family:Assistant,Tahoma,sans-serif;display:flex;justify-content:center;padding:16px 12px 32px}
    .phone{width:100%;max-width:440px;background:var(--cream);border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px var(--navy),0 24px 60px rgba(0,0,0,.45)}
    .top{text-align:center;padding:22px 18px 10px}
    .badge{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--navy);color:#f3e7b8;display:flex;align-items:center;justify-content:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:24px;border:3px solid #e8d48b}
    h1{font-family:"Frank Ruhl Libre",serif;color:var(--navy);font-size:24px}
    .sub{color:#5a5346;margin-top:4px}
    .row{display:flex;gap:8px;margin:10px 16px}
    a.btn,button.btn{flex:1;border:0;border-radius:14px;padding:12px 8px;font:800 14px Assistant,sans-serif;text-align:center;text-decoration:none}
    .navy{background:var(--navy);color:#f3e7b8}
    .gold{background:var(--gold);color:var(--navy)}
    form{margin:8px 16px 16px;background:#fff;border-radius:18px;padding:14px;border:1px solid rgba(201,162,39,.3)}
    label{display:block;font-weight:800;color:var(--navy);margin:8px 0 4px;font-size:13px}
    input,textarea{width:100%;border:1.5px solid #d7cbb3;border-radius:12px;padding:10px;font:16px Assistant,sans-serif;background:#fffdf8}
    textarea{min-height:220px;resize:vertical}
    .list{padding:0 16px 20px}
    .card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid rgba(201,162,39,.25)}
    .card b{color:var(--navy);display:block;margin-bottom:6px}
    .card p{white-space:pre-wrap;line-height:1.65}
    .card p.short{max-height:6.6em;overflow:hidden}
    .more{margin-top:8px;border:0;background:none;color:#1a2744;font-weight:800;padding:0}
    .card img{width:100%;border-radius:12px;margin-top:8px}
    .mine{display:flex;gap:8px;margin-top:10px}
    .mine button{flex:1;border:0;border-radius:10px;padding:8px;font-weight:800}
    .edit{background:#f3ead8;color:var(--navy)}
    .del{background:#f3e8e8;color:#7a2e2e}
    #note{text-align:center;color:#5a5346;padding:0 16px 16px}
  </style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="badge">13</div>
    <h1>ברכות מהאורחים</h1>
    <p class="sub">כתבו ברכה לשגיב. ניתן לערוך או למחוק רק את הברכה שלכם</p>
  </div>
  <div class="row">
    <a class="btn navy" href="brachot.html">ברכות המשפחה</a>
    <a class="btn gold" href="./">חזרה</a>
  </div>
  <form id="form">
    <label for="name">השם שלכם</label>
    <input id="name" required maxlength="80" placeholder="שם מלא" />
    <label for="text">הברכה</label>
    <textarea id="text" required placeholder="מזל טוב שגיב..."></textarea>
    <div class="row" style="margin:12px 0 0">
      <button class="btn gold" type="submit" id="save">שמירת ברכה</button>
    </div>
  </form>
  <div class="list" id="list"></div>
  <p id="note"></p>
</div>
<script>
const AUTH='Client-ID 546c25a59c58ad7', HASH='zlu4GEWHMh6vEso', ALBUM='LZUxwoK';
let owner=localStorage.getItem('shagiv-owner');
if(!owner){ owner='u'+Math.random().toString(36).slice(2,10); localStorage.setItem('shagiv-owner', owner); }
let editId=null, ALL=[];
const list=document.getElementById('list'), note=document.getElementById('note');
const nameEl=document.getElementById('name'), textEl=document.getElementById('text'), save=document.getElementById('save');
function parseWish(d){
  const s=String(d||'');
  if(!s.startsWith('WISH|')) return null;
  const p=s.split('|');
  let name='', text='', own=p[1]||'';
  try{ name=decodeURIComponent(p[2]||''); text=decodeURIComponent(p.slice(3).join('|')||''); }catch(e){ name=p[2]||''; text=p.slice(3).join('|'); }
  return {owner:own, name, text};
}
function localMap(){ try{return JSON.parse(localStorage.getItem('shagiv-wishes')||'{}');}catch(e){return{};} }
function saveLocal(id,name,text){ const m=localMap(); m[id]={name,text,owner}; localStorage.setItem('shagiv-wishes', JSON.stringify(m)); }
function descOf(name,text){
  const full='WISH|'+owner+'|'+encodeURIComponent(name)+'|'+encodeURIComponent(text);
  return full.length>1200 ? ('WISH|'+owner+'|'+encodeURIComponent(name)+'|') : full;
}
function wrapLines(ctx, text, maxWidth){
  const lines=[];
  for(const para of String(text||'').split('\n')){
    if(!para){ lines.push(''); continue; }
    let line='';
    for(const w of para.split(' ')){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w; }
      else line=test;
    }
    if(line) lines.push(line);
  }
  return lines;
}
function cardBlob(name,text){
  const c=document.createElement('canvas');
  const x=c.getContext('2d');
  x.font='28px Assistant,Arial';
  const lines=wrapLines(x, text, 780);
  c.width=900; c.height=Math.max(360, 130+lines.length*38);
  x.fillStyle='#f7f1e4'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#1a2744'; x.font='bold 36px Assistant,Arial'; x.textAlign='right';
  x.fillText(name||'אורח', 860, 70);
  x.fillStyle='#5a5346'; x.font='28px Assistant,Arial';
  lines.forEach((ln,i)=>x.fillText(ln,860,130+i*38));
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,ch=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[ch])); }
function draw(){
  if(!ALL.length){ list.innerHTML='<p style="text-align:center;color:#5a5346;font-weight:700">עדיין אין ברכות מאורחים</p>'; return; }
  list.innerHTML=ALL.map(w=>{
    const mine=w.owner===owner;
    const acts=mine?'<div class="mine"><button class="edit" data-id="'+w.id+'">עריכה</button><button class="del" data-id="'+w.id+'">מחיקה</button></div>':'';
    const long=(w.text||'').length>180 || (w.text||'').split('\n').length>4;
    const body=w.text ? '<p class="'+(long?'short':'')+'">'+escapeHtml(w.text)+'</p>'+(long?'<button class="more" type="button">הצג את כל הברכה</button>':'') : (w.img?'<img src="'+w.img+'" alt="">':'');
    return '<div class="card"><b>'+escapeHtml(w.name||'אורח')+'</b>'+body+acts+'</div>';
  }).join('');
  list.querySelectorAll('.edit').forEach(b=>b.onclick=()=>startEdit(b.dataset.id));
  list.querySelectorAll('.del').forEach(b=>b.onclick=()=>delWish(b.dataset.id));
  list.querySelectorAll('.more').forEach(b=>b.onclick=()=>{
    const p=b.previousElementSibling;
    p.classList.toggle('short');
    b.textContent=p.classList.contains('short')?'הצג את כל הברכה':'הצג פחות';
  });
}
function startEdit(id){
  const w=ALL.find(x=>x.id===id && x.owner===owner); if(!w) return;
  editId=id; nameEl.value=w.name||''; textEl.value=w.text||''; save.textContent='עדכון ברכה'; textEl.focus();
}
async function delWish(id){
  const w=ALL.find(x=>x.id===id); if(!w||w.owner!==owner) return;
  if(!confirm('למחוק את הברכה שלכם?')) return;
  try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:id})}); }catch(e){}
  setTimeout(load,700);
}
async function load(){
  ALL=[]; const local=localMap();
  try{
    const js=await (await fetch('https://api.imgur.com/3/album/'+ALBUM+'/images?t='+Date.now(),{headers:{Authorization:AUTH},cache:'no-store'})).json();
    for(const x of (js.data||[])){
      const w=parseWish(x.description||x.title||'');
      if(!w) continue;
      if(local[x.id] && local[x.id].text) w.text=local[x.id].text;
      ALL.push({id:x.id, owner:w.owner, name:w.name, text:w.text, img:x.link});
    }
  }catch(e){}
  draw();
}
document.getElementById('form').onsubmit=async e=>{
  e.preventDefault();
  const name=nameEl.value.trim(), text=textEl.value.trim();
  if(!name||!text) return;
  note.textContent='שומר...';
  try{
    if(editId){
      try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:editId})}); }catch(e){}
      editId=null; save.textContent='שמירת ברכה';
    }
    const blob=await cardBlob(name,text);
    const fd=new FormData();
    fd.append('image', new File([blob],'wish.jpg',{type:'image/jpeg'}));
    fd.append('album', HASH);
    fd.append('description', descOf(name,text));
    const r=await fetch('https://api.imgur.com/3/upload',{method:'POST', headers:{Authorization:AUTH}, body:fd});
    const j=await r.json();
    if(!j||!j.success||!j.data) throw new Error('upload');
    saveLocal(j.data.id, name, text);
    textEl.value=''; note.textContent='הברכה נשמרה';
    setTimeout(load,800);
  }catch(err){ note.textContent='לא הצלחנו לשמור. נסו שוב.'; }
};
load();
</script>
</body>
</html>
