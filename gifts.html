<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>כסף מהאורחים</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#1a2744;--gold:#c9a227;--cream:#f7f1e4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#1a2744;font-family:Assistant,Arial,sans-serif;display:flex;justify-content:center;padding:16px}
    .wrap{width:100%;max-width:480px;background:var(--cream);border-radius:24px;padding:16px}
    h1{text-align:center;font-family:"Frank Ruhl Libre",serif;color:var(--navy)}
    .sum{background:#fff;border:1px solid rgba(201,162,39,.35);border-radius:16px;padding:12px;text-align:center;margin:10px 0}
    .sum b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:28px;color:var(--navy)}
    .box{background:#fff;border-radius:16px;padding:12px;margin:8px 0;border:1px solid #eadfc8}
    label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin:6px 0 4px}
    input{width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid #d7cbb3;font:16px Assistant,sans-serif}
    .grid2{display:grid;grid-template-columns:1fr 90px;gap:8px}
    .add{width:100%;border:0;border-radius:12px;padding:12px;font:800 15px Assistant,sans-serif;background:var(--gold);color:var(--navy);margin-top:8px}
    a.btn{display:block;text-align:center;text-decoration:none;background:var(--navy);color:#f3e7b8;border-radius:12px;padding:12px;font-weight:800;margin:0 0 8px}
    .filt{display:flex;gap:8px;margin:8px 0 12px}
    .filt button{flex:1;border:1px solid #d7cbb3;border-radius:12px;padding:11px 8px;font:800 14px Assistant,sans-serif;background:#fff}
    .filt button.on{background:var(--navy);color:#f3e7b8}
    .tbl{font-weight:800;color:var(--navy);margin:14px 0 6px}
    .row{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid #eadfc8}
    .row .top{display:flex;gap:8px;align-items:center}
    .row .name{flex:1;font-weight:800}
    .row .meta{display:block;font-size:12px;color:#7a7366}
    .amt{width:92px;direction:ltr;text-align:left;font-weight:700}
    .del{border:0;background:#f3e8e8;color:#7a2e2e;border-radius:10px;padding:8px 10px;font-weight:800;margin-top:8px}
    #note{text-align:center;color:#5a5346;margin-top:8px;white-space:pre-wrap}
    .warn{background:#fff3d6;border-radius:12px;padding:10px;font-size:13px;line-height:1.45;margin:8px 0}
  </style>
</head>
<body>
<div class="wrap">
  <h1>כסף מהאורחים</h1>
  <a class="btn" href="admin.html">חזרה לניהול</a>
  <div class="box">
    <label>מפתח GitHub לשמירת guests.json</label>
    <input id="token" placeholder="ghp_... מדביקים כאן במכשיר" autocomplete="off" />
    <div class="warn">בלי מפתח אי אפשר לעדכן את הקובץ בשרת. צרו: טוקן classic עם הרשאת repo לחשבון yoav643.</div>
  </div>
  <div class="sum"><b id="total">0 ₪</b><span id="filled">טוען</span></div>
  <div class="box">
    <label>הוספת שם</label>
    <input id="newName" placeholder="שם האורח" />
    <div class="grid2">
      <div><label>תיאור</label><input id="newDesc" list="cats" /></div>
      <div><label>שולחן</label><input id="newTable" inputmode="numeric" /></div>
    </div>
    <button class="add" id="addBtn" type="button">הוספת אורח</button>
  </div>
  <input id="q" placeholder="חיפוש" style="margin:8px 0" />
  <div class="filt">
    <button type="button" id="allBtn" class="on">הכל</button>
    <button type="button" id="missBtn">בלי סכום</button>
    <button type="button" id="hasBtn">עם סכום</button>
  </div>
  <datalist id="cats">
    <option value="עבודה טלי"></option><option value="עבודה יואב"></option>
    <option value="חברים יואב"></option><option value="חברים טלי"></option>
    <option value="חברים טלי ויואב"></option><option value="חברים שגיב"></option>
    <option value="חברים לין"></option><option value="משפחה טלי"></option><option value="משפחה יואב"></option>
  </datalist>
  <div id="list"></div>
  <p id="note"></p>
</div>
<script>
const REPO='yoav643/shagiv-bar-mitzvah';
const PATH='guests.json';
const API='https://api.github.com/repos/'+REPO+'/contents/'+PATH;
const RAW='https://raw.githubusercontent.com/'+REPO+'/main/'+PATH;
const note=document.getElementById('note');
const tokenEl=document.getElementById('token');
let file={guests:[], extras:[]};
let sha='';
let filterMode='all';
let tmr=null;
tokenEl.value=localStorage.getItem('shagiv-gh-token')||'';
tokenEl.onchange=tokenEl.onblur=()=>localStorage.setItem('shagiv-gh-token', tokenEl.value.trim());
function token(){ return (tokenEl.value||localStorage.getItem('shagiv-gh-token')||'').trim(); }
function keyOf(g){ return String(g.name||'')+'|'+String(g.table||''); }
function num(v){ const n=Number(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isFinite(n)&&n>0?n:0; }
function people(){
  return (file.guests||[]).map(g=>Object.assign({extra:false},g))
    .concat((file.extras||[]).map(g=>Object.assign({extra:true, guests:g.guests||1},g)));
}
function target(k){ return (file.guests||[]).find(g=>keyOf(g)===k) || (file.extras||[]).find(g=>keyOf(g)===k); }
async function loadJson(){
  const r=await fetch(API+'?t='+Date.now(), {headers: token()?{Authorization:'Bearer '+token(), Accept:'application/vnd.github+json'}:{Accept:'application/vnd.github+json'}, cache:'no-store'});
  if(r.ok){
    const js=await r.json();
    sha=js.sha||'';
    const text=decodeURIComponent(escape(atob(String(js.content||'').replace(/\n/g,''))));
    file=JSON.parse(text);
    return;
  }
  file=await (await fetch(RAW+'?t='+Date.now(),{cache:'no-store'})).json();
}
async function saveJson(){
  const t=token();
  if(!t){ note.textContent='חסר מפתח GitHub כדי לשמור לקובץ בשרת'; return false; }
  note.textContent='שומר ל-guests.json...';
  const body=JSON.stringify(file,null,2);
  const content=btoa(unescape(encodeURIComponent(body)));
  const r=await fetch(API,{method:'PUT', headers:{Authorization:'Bearer '+t, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}, body:JSON.stringify({message:'update guests money', content, sha, branch:'main'})});
  const js=await r.json();
  if(!r.ok){ note.textContent='שמירה נכשלה: '+(js.message||r.status); return false; }
  sha=js.content&&js.content.sha||sha;
  note.textContent='נשמר ב-guests.json בשרת';
  return true;
}
function totals(){
  const p=people(); let sum=0, filled=0;
  for(const g of p){ if(num(g.amount)){ sum+=num(g.amount); filled++; } }
  document.getElementById('total').textContent=sum.toLocaleString('he-IL')+' ₪';
  document.getElementById('filled').textContent=filled+' עם סכום · '+(p.length-filled)+' בלי סכום';
  document.getElementById('missBtn').textContent='בלי סכום ('+(p.length-filled)+')';
  document.getElementById('hasBtn').textContent='עם סכום ('+filled+')';
}
function draw(){
  const q=document.getElementById('q').value.trim();
  const rows=people().sort((a,b)=>(Number(a.table)||99)-(Number(b.table)||99)||a.name.localeCompare(b.name,'he'));
  const filt=rows.filter(g=>{
    if(filterMode==='miss' && num(g.amount)) return false;
    if(filterMode==='has' && !num(g.amount)) return false;
    if(!q) return true;
    return g.name.includes(q)||String(g.table)===q||(g.desc||'').includes(q);
  });
  let html='', last='__';
  for(const g of filt){
    const k=keyOf(g);
    if(String(g.table)!==last){ html+='<div class="tbl">'+(g.table?('שולחן '+g.table):'ללא שולחן')+'</div>'; last=String(g.table); }
    html+='<div class="row"><div class="top"><div class="name">'+g.name+'<span class="meta">'+(g.guests||1)+' אורחים'+(g.extra?' · נוסף':'')+'</span></div>';
    html+='<input class="amt" data-key="'+k+'" inputmode="numeric" placeholder="₪" value="'+(num(g.amount)||'')+'" /></div>';
    html+='<input class="desc" list="cats" data-desc="'+k+'" placeholder="תיאור" value="'+(g.desc||'')+'" />';
    if(g.extra) html+='<button class="del" data-del="'+k+'">מחיקת שם</button>';
    html+='</div>';
  }
  document.getElementById('list').innerHTML=html||'<p style="text-align:center">לא נמצאו</p>';
  const bind=(inp,kind)=>{
    const run=()=>{ const t=target(inp.dataset.key||inp.dataset.desc); if(!t) return; if(kind==='amt') t.amount=num(inp.value); else t.desc=inp.value.trim(); totals(); clearTimeout(tmr); tmr=setTimeout(saveJson,500); };
    inp.oninput=run; inp.onchange=run; inp.onblur=saveJson;
  };
  document.querySelectorAll('input.amt').forEach(i=>bind(i,'amt'));
  document.querySelectorAll('input.desc').forEach(i=>bind(i,'desc'));
  document.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=async()=>{ if(!confirm('למחוק?')) return; file.extras=(file.extras||[]).filter(g=>keyOf(g)!==btn.dataset.del); draw(); await saveJson(); });
  totals();
}
document.getElementById('addBtn').onclick=async()=>{
  const name=document.getElementById('newName').value.trim();
  const desc=document.getElementById('newDesc').value.trim();
  const table=document.getElementById('newTable').value.trim();
  if(!name){ note.textContent='חסר שם'; return; }
  if(people().some(g=>g.name===name && String(g.table)===String(table))){ note.textContent='השם כבר קיים'; return; }
  file.extras=file.extras||[];
  file.extras.push({name,table,guests:1,amount:0,desc});
  document.getElementById('newName').value='';
  draw(); await saveJson();
};
document.getElementById('q').oninput=draw;
const allBtn=document.getElementById('allBtn'), missBtn=document.getElementById('missBtn'), hasBtn=document.getElementById('hasBtn');
allBtn.onclick=()=>{filterMode='all'; document.querySelectorAll('.filt button').forEach(b=>b.classList.remove('on')); allBtn.classList.add('on'); draw();};
missBtn.onclick=()=>{filterMode='miss'; document.querySelectorAll('.filt button').forEach(b=>b.classList.remove('on')); missBtn.classList.add('on'); draw();};
hasBtn.onclick=()=>{filterMode='has'; document.querySelectorAll('.filt button').forEach(b=>b.classList.remove('on')); hasBtn.classList.add('on'); draw();};
(async()=>{ try{ await loadJson(); note.textContent='נטען מ-guests.json'; }catch(e){ note.textContent='לא הצלחתי לטעון את הקובץ'; file={guests:[],extras:[]}; } draw(); })();
</script>
</body></html>
