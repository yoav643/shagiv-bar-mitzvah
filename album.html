<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>האלבום המשותף · שגיב</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; color:#2a2418; }
    .wrap { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; font-size:22px; margin:6px 0; }
    p { text-align:center; color:#5a5346; }
    .row { display:flex; gap:8px; margin:12px 0; }
    a.btn { flex:1; text-align:center; text-decoration:none; border-radius:14px; padding:14px 8px; font-weight:800; }
    .navy { background:#1a2744; color:#f3e7b8; }
    .gold { background:#c9a227; color:#1a2744; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .item { background:#fff; border-radius:12px; overflow:hidden; }
    .item img, .item video { width:100%; height:160px; object-fit:cover; display:block; background:#ddd; }
    .empty { text-align:center; padding:24px 8px; font-weight:700; grid-column:1/-1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>האלבום המשותף</h1>
    <p>כל התמונות והסרטונים שהאורחים העלו</p>
    <div class="row">
      <a class="btn gold" href="photos.html">להעלות תמונה</a>
      <a class="btn navy" href="./">חזרה</a>
    </div>
    <div id="grid" class="grid"></div>
    <p id="note"></p>
  </div>
  <script>
    const ALBUM='https://extendsclass.com/api/json-storage/bin/bacfbbe';
    const CACHE='shagiv-album-cache';
    const grid=document.getElementById('grid');
    const note=document.getElementById('note');
    function draw(items){
      const list=(items||[]).filter(x=>x && x.url && String(x.url).startsWith('http'));
      if(!list.length){ grid.innerHTML='<div class="empty">עדיין אין תמונות. היו הראשונים להעלות.</div>'; return; }
      grid.innerHTML=list.map(it=> it.video
        ? '<div class="item"><video src="'+it.url+'" controls playsinline></video></div>'
        : '<div class="item"><a href="'+it.url+'" target="_blank" rel="noopener"><img src="'+it.url+'" alt=""></a></div>'
      ).join('');
      note.textContent=list.length+' פריטים באלבום';
    }
    async function load(){
      let items=[];
      try{ items=JSON.parse(localStorage.getItem(CACHE)||'[]'); }catch(e){}
      try{
        const res=await fetch(ALBUM+'?t='+Date.now(),{cache:'no-store'});
        const data=await res.json();
        const remote=(data.items||[]).filter(x=>x && x.url);
        const map=new Map();
        [...items, ...remote].forEach(x=>{ if(x && x.id) map.set(x.id,x); });
        items=[...map.values()];
        localStorage.setItem(CACHE, JSON.stringify(items));
      }catch(e){}
      draw(items);
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
