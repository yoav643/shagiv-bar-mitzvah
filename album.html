<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>האלבום המשותף · שגיב</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; color:#2a2418; }
    .wrap { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; font-size:22px; margin:6px 0; }
    p { text-align:center; color:#5a5346; }
    .row { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
    a.btn, button.btn { flex:1; text-align:center; text-decoration:none; border-radius:14px; padding:14px 8px; font-weight:800; border:0; font:800 15px Arial,sans-serif; cursor:pointer; }
    .navy { background:#1a2744; color:#f3e7b8; }
    .gold { background:#c9a227; color:#1a2744; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .item { background:#fff; border-radius:12px; overflow:hidden; }
    .item img, .item video { width:100%; height:160px; object-fit:cover; display:block; background:#ddd; }
    .empty { text-align:center; padding:24px 8px; font-weight:700; grid-column:1/-1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>האלבום המשותף</h1>
    <p>כל התמונות והסרטונים שהאורחים העלו</p>
    <div class="row">
      <a class="btn gold" href="photos.html">להעלות תמונה</a>
      <a class="btn navy" href="./">חזרה</a>
    </div>
    <div class="row">
      <button class="btn gold" id="dl" type="button">הורדת הכל למחשב</button>
    </div>
    <div id="grid" class="grid"></div>
    <p id="note"></p>
  </div>
  <script>
    const ALBUM='https://extendsclass.com/api/json-storage/bin/bacfbbe';
    const CACHE='shagiv-album-cache';
    const grid=document.getElementById('grid');
    const note=document.getElementById('note');
    const dl=document.getElementById('dl');
    let LAST=[];
    function draw(items){
      const list=(items||[]).filter(x=>x && x.url && String(x.url).startsWith('http'));
      LAST=list;
      if(!list.length){ grid.innerHTML='<div class="empty">עדיין אין תמונות. היו הראשונים להעלות.</div>'; return; }
      grid.innerHTML=list.map(it=> it.video
        ? '<div class="item"><video src="'+it.url+'" controls playsinline></video></div>'
        : '<div class="item"><a href="'+it.url+'" target="_blank" rel="noopener"><img src="'+it.url+'" alt=""></a></div>'
      ).join('');
      note.textContent=list.length+' פריטים באלבום';
    }
    async function load(){
      let items=[];
      try{ items=JSON.parse(localStorage.getItem(CACHE)||'[]'); }catch(e){}
      try{
        const res=await fetch(ALBUM+'?t='+Date.now(),{cache:'no-store'});
        const data=await res.json();
        const remote=(data.items||[]).filter(x=>x && x.url);
        const map=new Map();
        [...items, ...remote].forEach(x=>{ if(x && x.id) map.set(x.id,x); });
        items=[...map.values()];
        localStorage.setItem(CACHE, JSON.stringify(items));
      }catch(e){}
      draw(items);
    }
    function saveBlob(blob, name){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    async function downloadAll(){
      if(!LAST.length){ note.textContent='אין קבצים להורדה'; return; }
      dl.disabled=true;
      dl.textContent='מכין הורדה...';
      try{
        const zip=new JSZip();
        let ok=0;
        for(let i=0;i<LAST.length;i++){
          const it=LAST[i];
          note.textContent='מוריד '+ (i+1) +' מתוך '+LAST.length;
          try{
            const res=await fetch(it.url, {mode:'cors'});
            if(!res.ok) throw new Error('http');
            const blob=await res.blob();
            const ext=it.video ? 'mp4' : (blob.type.includes('png')?'png':'jpg');
            zip.file('shagiv-'+(i+1)+'.'+ext, blob);
            ok++;
          }catch(e){
            try{
              const a=document.createElement('a');
              a.href=it.url;
              a.target='_blank';
              a.rel='noopener';
              document.body.appendChild(a);
              a.click();
              a.remove();
            }catch(e2){}
          }
        }
        if(ok){
          const out=await zip.generateAsync({type:'blob'});
          saveBlob(out, 'album-shagiv.zip');
          note.textContent='הורדו '+ok+' קבצים';
        } else {
          note.textContent='לא הצלחנו לארוז לזיפ. נפתחו הקבצים להורדה ידנית.';
        }
      }catch(e){
        note.textContent='שגיאה בהורדה. נסו שוב.';
      }
      dl.disabled=false;
      dl.textContent='הורדת הכל למחשב';
    }
    dl.onclick=downloadAll;
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
