<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a2744" />
  <title>האלבום המשותף · שגיב</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{--navy:#1a2744;--gold:#c9a227;--cream:#f7f1e4;--white:#fffdf8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:radial-gradient(ellipse at top,#2c3d62,#1a2744 55%,#10182a);font-family:Assistant,Tahoma,sans-serif;display:flex;justify-content:center;padding:16px 12px 32px}
    .phone{width:100%;max-width:440px;background:var(--cream);border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px var(--navy),0 24px 60px rgba(0,0,0,.45)}
    .top{text-align:center;padding:22px 18px 8px}
    .badge{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--navy);color:#f3e7b8;display:flex;align-items:center;justify-content:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:24px;border:3px solid #e8d48b}
    h1{font-family:"Frank Ruhl Libre",serif;color:var(--navy);font-size:26px}
    .sub{color:#5a5346;margin-top:4px}
    .row{display:flex;gap:8px;margin:10px 16px;flex-wrap:wrap}
    a.btn,button.btn{flex:1;min-width:46%;border:0;border-radius:14px;padding:13px 8px;font:800 14px Assistant,sans-serif;text-align:center;text-decoration:none}
    .navy{background:var(--navy);color:#f3e7b8}
    .gold{background:var(--gold);color:var(--navy)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 18px}
    .item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px rgba(26,39,68,.08)}
    .item img,.item video{width:100%;height:168px;object-fit:cover;display:block;background:#111}
    .open{display:block;text-align:center;font-size:13px;font-weight:800;padding:10px;background:var(--navy);color:#f3e7b8;text-decoration:none}
    .del{width:100%;border:0;background:#f3e8e8;color:#7a2e2e;font-weight:800;padding:10px}
    #note{text-align:center;color:#5a5346;padding:0 16px 18px}
  </style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="badge">13</div>
    <h1>האלבום המשותף</h1>
    <p class="sub">תמונות וסרטונים מהאורחים</p>
  </div>
  <div class="row">
    <a class="btn gold" href="photos.html">להעלות</a>
    <a class="btn navy" href="./">חזרה</a>
  </div>
  <div class="row">
    <button class="btn navy" id="mineBtn" type="button">הצג רק מה שצילמתי</button>
    <button class="btn gold" id="dlMine" type="button">הורד מה שצילמתי</button>
  </div>
  <div class="row"><button class="btn gold" id="dl" type="button">הורדת הכל למחשב</button></div>
  <div id="grid" class="grid"></div>
  <p id="note"></p>
</div>
<script>
const ALBUM_ID='LZUxwoK', HASH='zlu4GEWHMh6vEso', AUTH='Client-ID 546c25a59c58ad7';
let owner=localStorage.getItem('shagiv-owner')||'', onlyMine=false, ALL=[];
function mineIds(){ try{return JSON.parse(localStorage.getItem('shagiv-mine-ids')||'[]');}catch(e){return[];} }
function parseDesc(d){ d=String(d||''); if(d.startsWith('VID|')){ const p=d.split('|'); return {video:true,owner:p[1]||'',url:p.slice(2).join('|')}; } return {video:false,owner:d,url:''}; }
function isMine(it){ return (it.owner&&owner&&it.owner===owner)||mineIds().includes(it.id); }
async function rawVideo(url){
  if(!url || url.indexOf('tmpfiles.org')<0) return url;
  if(/\/dl\/[^/]+\/[^/]+\//.test(url)) return url;
  const view=url.replace('https://tmpfiles.org/dl/','https://tmpfiles.org/');
  try{
    const page=await (await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(view))).text();
    const m=page.match(/https:\/\/tmpfiles\.org\/dl\/[^"'\s<]+/);
    if(m) return m[0];
  }catch(e){}
  return view;
}
const grid=document.getElementById('grid'), note=document.getElementById('note'), mineBtn=document.getElementById('mineBtn');
function draw(){
  const list=onlyMine?ALL.filter(isMine):ALL;
  if(!list.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;font-weight:800;padding:28px 8px;color:#5a5346">עדיין אין תמונות</div>'; note.textContent=''; return; }
  grid.innerHTML=list.map(it=>{
    const media=it.video
      ? ('<video src="'+it.url+'" poster="'+(it.poster||'')+'" controls playsinline webkit-playsinline></video><a class="open" href="'+it.url+'" target="_blank" rel="noopener">נגן סרטון בטלפון</a>')
      : ('<a href="'+it.url+'" target="_blank" rel="noopener"><img src="'+it.url+'" alt=""></a>');
    const del=isMine(it)?'<button class="del" data-id="'+it.id+'">מחיקת התמונה שלי</button>':'';
    return '<div class="item">'+media+del+'</div>';
  }).join('');
  grid.querySelectorAll('.del').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
  note.textContent=list.length+' פריטים באלבום';
}
async function load(){
  const map=new Map();
  try{
    const js=await (await fetch('https://api.imgur.com/3/album/'+ALBUM_ID+'/images?t='+Date.now(),{headers:{Authorization:AUTH},cache:'no-store'})).json();
    for(const x of (js.data||[])){
      const rawDesc=String(x.description||x.title||'');
      if(rawDesc.startsWith('WISH|')||rawDesc.startsWith('LOG|')||rawDesc.startsWith('CASH')||rawDesc.startsWith('REV|')) continue;
      const meta=parseDesc(rawDesc);
      const video=!!meta.video;
      let url=video?(meta.url||x.link):x.link;
      if(video) url=await rawVideo(url);
      map.set(x.id,{id:x.id,url,poster:x.link,video,owner:meta.owner});
    }
  }catch(e){}
  ALL=[...map.values()];
  draw();
}
async function delOne(id){
  if(!confirm('למחוק?')) return;
  try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:id})}); }catch(e){}
  setTimeout(load,800);
}
async function zipOf(list,name){
  if(!list.length) return;
  const zip=new JSZip(); let n=0;
  for(const it of list){ try{ zip.file((it.video?'clip':'pic')+'-'+it.id+(it.video?'.mp4':'.jpg'), await (await fetch(it.url)).blob()); n++; }catch(e){} }
  if(!n) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'})); a.download=name; a.click();
}
mineBtn.onclick=()=>{ onlyMine=!onlyMine; mineBtn.textContent=onlyMine?'הצג את הכל':'הצג רק מה שצילמתי'; draw(); };
document.getElementById('dlMine').onclick=()=>zipOf(ALL.filter(isMine),'shagiv-mine.zip');
document.getElementById('dl').onclick=()=>zipOf(ALL,'album-shagiv.zip');
load(); setInterval(load,8000);
</script>
</body></html>
