<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>האלבום המשותף · שגיב</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; color:#2a2418; }
    .wrap { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; font-size:22px; margin:6px 0; }
    p { text-align:center; color:#5a5346; }
    .row { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
    a.btn, button.btn { flex:1; text-align:center; text-decoration:none; border-radius:14px; padding:14px 8px; font-weight:800; border:0; font:800 15px Arial,sans-serif; }
    .navy { background:#1a2744; color:#f3e7b8; }
    .gold { background:#c9a227; color:#1a2744; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .item { background:#fff; border-radius:12px; overflow:hidden; }
    .item img, .item video { width:100%; height:160px; object-fit:cover; display:block; background:#ddd; }
    .empty { text-align:center; padding:24px 8px; font-weight:700; grid-column:1/-1; }
    .del { width:100%; border:0; background:#eee; color:#7a2e2e; font-weight:800; padding:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>האלבום המשותף</h1>
    <p>כל התמונות והסרטונים שהאורחים העלו</p>
    <div class="row">
      <a class="btn gold" href="photos.html">להעלות תמונה</a>
      <a class="btn navy" href="./">חזרה</a>
    </div>
    <div class="row">
      <button class="btn gold" id="dl" type="button">הורדת הכל למחשב</button>
    </div>
    <div id="grid" class="grid"></div>
    <p id="note"></p>
  </div>
  <script>
    const ALBUM_ID='LZUxwoK';
    const HASH='zlu4GEWHMh6vEso';
    const CLIENT='Client-ID 546c25a59c58ad7';
    const grid=document.getElementById('grid');
    const note=document.getElementById('note');
    const dl=document.getElementById('dl');
    let LAST=[];
    function draw(list){
      LAST=list||[];
      if(!LAST.length){ grid.innerHTML='<div class="empty">עדיין אין תמונות. היו הראשונים להעלות.</div>'; note.textContent=''; return; }
      grid.innerHTML=LAST.map(it=>{
        const media=it.video ? '<video src="'+it.url+'" controls playsinline></video>' : '<a href="'+it.url+'" target="_blank" rel="noopener"><img src="'+it.url+'" alt=""></a>';
        return '<div class="item">'+media+'<button class="del" data-id="'+it.id+'">מחיקה</button></div>';
      }).join('');
      grid.querySelectorAll('.del').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
      note.textContent=LAST.length+' פריטים באלבום';
    }
    async function delOne(id){
      if(!confirm('למחוק את התמונה מהאלבום?')) return;
      note.textContent='מוחק...';
      try{
        await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images', {
          method:'POST',
          headers:{ Authorization: CLIENT },
          body: new URLSearchParams({ids:id})
        });
      }catch(e){}
      setTimeout(load, 700);
    }
    async function load(){
      try{
        const res=await fetch('https://api.imgur.com/3/album/'+ALBUM_ID+'/images?t='+Date.now(), { headers:{ Authorization: CLIENT }, cache:'no-store' });
        const data=await res.json();
        const imgs=(data.data||[]).map(x=>({ id:x.id, url:x.link, video: String(x.type||'').startsWith('video') || !!x.mp4 })).filter(x=>x.url);
        draw(imgs);
      }catch(e){ note.textContent='לא הצלחנו לטעון את האלבום.'; }
    }
    function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
    dl.onclick=async()=>{
      if(!LAST.length){ note.textContent='אין קבצים להורדה'; return; }
      dl.disabled=true; dl.textContent='מכין הורדה...';
      try{
        const zip=new JSZip(); let ok=0;
        for(let i=0;i<LAST.length;i++){
          try{ const res=await fetch(LAST[i].url); const blob=await res.blob(); const ext=LAST[i].video?'mp4':(blob.type.includes('png')?'png':'jpg'); zip.file('shagiv-'+(i+1)+'.'+ext, blob); ok++; }catch(e){}
        }
        if(ok){ saveBlob(await zip.generateAsync({type:'blob'}), 'album-shagiv.zip'); note.textContent='הורדו '+ok+' קבצים'; }
        else note.textContent='לא הצלחנו לארוז.';
      }catch(e){ note.textContent='שגיאה בהורדה'; }
      dl.disabled=false; dl.textContent='הורדת הכל למחשב';
    };
    load(); setInterval(load, 8000);
  </script>
</body>
</html>
