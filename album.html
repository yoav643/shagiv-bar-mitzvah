<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>האלבום המשותף</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#1a2744}
    .wrap{max-width:440px;margin:16px auto;background:#f7f1e4;border-radius:24px;padding:16px}
    h1,p{text-align:center}h1{color:#1a2744}p{color:#5a5346}
    .row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
    a.btn,button.btn{flex:1;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:12px 8px;font-weight:800;font:800 14px Arial;min-width:46%}
    .navy{background:#1a2744;color:#f3e7b8}.gold{background:#c9a227;color:#1a2744}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .item{background:#fff;border-radius:12px;overflow:hidden;position:relative}
    .item img{width:100%;height:160px;object-fit:cover;display:block;background:#ddd}
    .play{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:rgba(26,39,68,.85);color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800;pointer-events:none}
    .open{display:block;text-align:center;font-size:13px;font-weight:800;padding:8px;background:#f3ead8;color:#1a2744;text-decoration:none}
    .del{width:100%;border:0;background:#eee;color:#7a2e2e;font-weight:800;padding:8px}
    #player{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;align-items:center;justify-content:center;flex-direction:column;padding:16px}
    #player.show{display:flex}
    #player video{width:100%;max-width:520px;max-height:70vh;background:#000}
    #player a,#player button{margin-top:10px;color:#fff;font-weight:800;background:#c9a227;color:#1a2744;border:0;border-radius:12px;padding:12px 16px;text-decoration:none}
  </style>
</head>
<body>
<div class="wrap">
  <h1>האלבום המשותף</h1>
  <div class="row">
    <a class="btn gold" href="photos.html">להעלות</a>
    <a class="btn navy" href="./">חזרה</a>
  </div>
  <div class="row">
    <button class="btn navy" id="mineBtn" type="button">הצג רק מה שצילמתי</button>
    <button class="btn gold" id="dlMine" type="button">הורד מה שצילמתי</button>
  </div>
  <div class="row"><button class="btn gold" id="dl" type="button">הורדת הכל למחשב</button></div>
  <div id="grid" class="grid"></div>
  <p id="note"></p>
</div>
<div id="player"><video id="pv" controls playsinline></video><a id="pd" href="#" target="_blank" rel="noopener">הורדה / פתיחה</a><button type="button" id="pc">סגירה</button></div>
<script>
const ALBUM_ID='LZUxwoK', HASH='zlu4GEWHMh6vEso', AUTH='Client-ID 546c25a59c58ad7';
let owner=localStorage.getItem('shagiv-owner')||'', onlyMine=false, ALL=[];
function mineIds(){ try{return JSON.parse(localStorage.getItem('shagiv-mine-ids')||'[]');}catch(e){return[];} }
function parseDesc(d){ d=String(d||''); if(d.startsWith('VID|')){ const p=d.split('|'); return {video:true,owner:p[1]||'',url:p.slice(2).join('|')}; } return {video:false,owner:d,url:''}; }
function isMine(it){ return (it.owner&&owner&&it.owner===owner)||mineIds().includes(it.id); }
async function rawVideo(url){
  if(!url || url.indexOf('tmpfiles.org')<0) return url;
  if(/\/dl\/[^/]+\/[^/]+\//.test(url)) return url;
  const view=url.replace('https://tmpfiles.org/dl/','https://tmpfiles.org/');
  try{
    const page=await (await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(view))).text();
    const m=page.match(/https:\/\/tmpfiles\.org\/dl\/[^"'\s<]+/);
    if(m) return m[0];
  }catch(e){}
  return view;
}
const grid=document.getElementById('grid'), note=document.getElementById('note'), mineBtn=document.getElementById('mineBtn');
const player=document.getElementById('player'), pv=document.getElementById('pv'), pd=document.getElementById('pd');
function openVid(url){
  pv.src=url; pd.href=url; player.classList.add('show'); pv.play().catch(()=>{});
}
document.getElementById('pc').onclick=()=>{ pv.pause(); player.classList.remove('show'); };
function draw(){
  const list=onlyMine?ALL.filter(isMine):ALL;
  if(!list.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;font-weight:700;padding:18px">עדיין אין תמונות</div>'; note.textContent=''; return; }
  grid.innerHTML=list.map(it=>{
    const img=it.video?(it.poster||it.url):it.url;
    const media='<img src="'+img+'" alt="">'+(it.video?'<div class="play">▶ סרטון</div>':'');
    const open=it.video?'<a class="open" data-play="'+it.url+'" href="'+it.url+'">נגן סרטון</a>':'';
    const del=isMine(it)?'<button class="del" data-id="'+it.id+'">מחיקת התמונה שלי</button>':'';
    return '<div class="item" '+(it.video?'data-play="'+it.url+'"':'')+'>'+media+open+del+'</div>';
  }).join('');
  grid.querySelectorAll('[data-play]').forEach(el=>el.onclick=e=>{ e.preventDefault(); openVid(el.getAttribute('data-play')); });
  grid.querySelectorAll('.del').forEach(b=>b.onclick=e=>{ e.stopPropagation(); delOne(b.dataset.id); });
  note.textContent=list.length+' פריטים';
}
async function load(){
  const map=new Map();
  try{
    const js=await (await fetch('https://api.imgur.com/3/album/'+ALBUM_ID+'/images?t='+Date.now(),{headers:{Authorization:AUTH},cache:'no-store'})).json();
    for(const x of (js.data||[])){
      const meta=parseDesc(x.description||x.title||'');
      const video=!!meta.video;
      let url=video?(meta.url||x.link):x.link;
      if(video) url=await rawVideo(url);
      map.set(x.id,{id:x.id,url,poster:x.link,video,owner:meta.owner});
    }
  }catch(e){}
  ALL=[...map.values()];
  draw();
}
async function delOne(id){
  if(!confirm('למחוק?')) return;
  try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:id})}); }catch(e){}
  setTimeout(load,800);
}
async function zipOf(list,name){
  if(!list.length) return;
  const zip=new JSZip(); let n=0;
  for(const it of list){ try{ zip.file((it.video?'clip':'pic')+'-'+it.id+(it.video?'.mp4':'.jpg'), await (await fetch(it.video?it.url:it.poster||it.url)).blob()); n++; }catch(e){} }
  if(!n) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'})); a.download=name; a.click();
}
mineBtn.onclick=()=>{ onlyMine=!onlyMine; mineBtn.textContent=onlyMine?'הצג את הכל':'הצג רק מה שצילמתי'; draw(); };
document.getElementById('dlMine').onclick=()=>zipOf(ALL.filter(isMine),'shagiv-mine.zip');
document.getElementById('dl').onclick=()=>zipOf(ALL,'album-shagiv.zip');
load(); setInterval(load,8000);
</script>
</body></html>
