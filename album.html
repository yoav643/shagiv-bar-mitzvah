<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>האלבום המשותף</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#1a2744}
    .wrap{max-width:440px;margin:16px auto;background:#f7f1e4;border-radius:24px;padding:16px}
    h1,p{text-align:center}h1{color:#1a2744}p{color:#5a5346}
    .row{display:flex;gap:8px;margin:12px 0}
    a.btn,button.btn{flex:1;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px 8px;font-weight:800;font:800 15px Arial}
    .navy{background:#1a2744;color:#f3e7b8}.gold{background:#c9a227;color:#1a2744}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .item{background:#fff;border-radius:12px;overflow:hidden}
    .item img,.item video{width:100%;height:160px;object-fit:cover;display:block;background:#ddd}
    .open{display:block;text-align:center;font-size:13px;font-weight:800;padding:8px;color:#1a2744;text-decoration:none}
    .del{width:100%;border:0;background:#eee;color:#7a2e2e;font-weight:800;padding:8px}
    .empty{grid-column:1/-1;text-align:center;font-weight:700;padding:18px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>האלבום המשותף</h1>
  <div class="row">
    <a class="btn gold" href="photos.html">להעלות</a>
    <a class="btn navy" href="./">חזרה</a>
  </div>
  <div class="row"><button class="btn gold" id="dl" type="button">הורדת הכל למחשב</button></div>
  <div id="grid" class="grid"></div>
  <p id="note"></p>
</div>
<script>
const ALBUM_ID='LZUxwoK', HASH='zlu4GEWHMh6vEso', AUTH='Client-ID 546c25a59c58ad7';
const q=new URLSearchParams(location.search).get('me');
let owner=q || localStorage.getItem('shagiv-owner') || '';
if(q) localStorage.setItem('shagiv-owner', q);
function mineIds(){ try{return JSON.parse(localStorage.getItem('shagiv-mine-ids')||'[]');}catch(e){return[];} }
const grid=document.getElementById('grid'), note=document.getElementById('note');
let LAST=[];
function parseDesc(d){ d=String(d||''); if(d.startsWith('VID|')){ const p=d.split('|'); return {video:true, owner:p[1]||'', url:p.slice(2).join('|')}; } return {video:false, owner:d, url:''}; }
function canDel(it){ return (it.owner && owner && it.owner===owner) || mineIds().includes(it.id); }
async function playable(url){
  if(!url || url.indexOf('tmpfiles.org')<0) return url;
  if(/tmpfiles\.org\/dl\/[^/]+\/[^/]+\//.test(url)) return url;
  const view=url.replace('https://tmpfiles.org/dl/','https://tmpfiles.org/');
  try{
    const page=await (await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(view))).text();
    const m=page.match(/https:\/\/tmpfiles\.org\/dl\/[^"'\s<]+/);
    if(m) return m[0];
  }catch(e){}
  return url;
}
function draw(list){
  LAST=list;
  if(!list.length){ grid.innerHTML='<div class="empty">עדיין אין תמונות</div>'; return; }
  grid.innerHTML=list.map(it=>{
    const media=it.video?'<video src="'+it.url+'" controls playsinline></video><a class="open" href="'+it.url+'" target="_blank" rel="noopener">פתיחת סרטון</a>':'<a href="'+it.url+'" target="_blank" rel="noopener"><img src="'+it.url+'"></a>';
    const del=canDel(it)?'<button class="del" data-id="'+it.id+'">מחיקת התמונה שלי</button>':'';
    return '<div class="item">'+media+del+'</div>';
  }).join('');
  grid.querySelectorAll('.del').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
  note.textContent=list.length+' פריטים';
}
async function delOne(id){
  if(!confirm('למחוק?')) return;
  try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:id})}); }catch(e){}
  localStorage.setItem('shagiv-mine-ids', JSON.stringify(mineIds().filter(x=>x!==id)));
  setTimeout(load,600);
}
async function load(){
  try{
    const res=await fetch('https://api.imgur.com/3/album/'+ALBUM_ID+'/images?t='+Date.now(),{headers:{Authorization:AUTH},cache:'no-store'});
    const js=await res.json();
    const list=await Promise.all((js.data||[]).map(async x=>{
      const meta=parseDesc(x.description||x.title||'');
      let url=meta.video && meta.url ? meta.url : x.link;
      const video=meta.video || String(x.type||'').startsWith('video') || !!x.mp4;
      if(video) url=await playable(url);
      return {id:x.id, url, video, owner:meta.owner};
    }));
    draw(list.filter(x=>x.url));
  }catch(e){ note.textContent='שגיאה בטעינה'; }
}
document.getElementById('dl').onclick=async()=>{
  if(!LAST.length) return;
  const zip=new JSZip(); let n=0;
  for(const it of LAST){ try{ zip.file((it.video?'clip':'pic')+'-'+it.id+(it.video?'.mp4':'.jpg'), await (await fetch(it.url)).blob()); n++; }catch(e){} }
  if(!n) return;
  const a=document.createElement('a'); a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'})); a.download='album-shagiv.zip'; a.click();
};
load(); setInterval(load,8000);
</script>
</body></html>
