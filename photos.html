<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>צילום לאלבום</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#1a2744}
    .card{max-width:440px;margin:16px auto;background:#f7f1e4;border-radius:24px;padding:16px}
    h1,p{text-align:center}h1{color:#1a2744}p{color:#5a5346}
    video#live{width:100%;border-radius:16px;background:#000;min-height:200px;object-fit:cover}
    .front{transform:scaleX(-1)}
    .row{display:flex;gap:8px;margin-top:10px}
    button,.back{flex:1;border:0;border-radius:14px;padding:12px 8px;font-weight:800}
    .cam{background:#1a2744;color:#f3e7b8}.gal{background:#c9a227;color:#1a2744}.rec{background:#7a2e2e;color:#fff}
    .del{background:#eee;color:#7a2e2e;width:100%;margin-top:8px}
    .back{display:block;text-align:center;text-decoration:none;background:#fff;color:#1a2744;margin-top:12px}
    .hidden{position:absolute;opacity:0;width:1px;height:1px}
    .item{background:#fff;border-radius:12px;padding:8px;margin-top:8px;text-align:center}
    .item img,.item video{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
  </style>
</head>
<body>
<div class="card">
  <h1>צילום לאלבום</h1>
  <video id="live" class="front" playsinline autoplay muted></video>
  <div class="row"><button class="cam" id="flip" type="button">החלף למצלמה אחורית</button></div>
  <div class="row">
    <button class="cam" id="snap" type="button">צלם והעלה</button>
    <button class="rec" id="rec" type="button">הקלט סרטון</button>
  </div>
  <div class="row"><button class="gal" id="openGal" type="button">מהגלריה</button></div>
  <input id="gal" class="hidden" type="file" accept="image/*,video/*" multiple>
  <p id="note"></p>
  <div id="list"></div>
  <a class="back" href="album.html">לאלבום המשותף</a>
  <a class="back" href="./">חזרה</a>
</div>
<script>
const AUTH='Client-ID 546c25a59c58ad7', HASH='zlu4GEWHMh6vEso';
const live=document.getElementById('live'), note=document.getElementById('note'), list=document.getElementById('list'), gal=document.getElementById('gal'), flip=document.getElementById('flip');
let stream=null, recorder=null, chunks=[], facing='user';
let owner=localStorage.getItem('shagiv-owner');
if(!owner){ owner='u'+Math.random().toString(36).slice(2,10); localStorage.setItem('shagiv-owner', owner); }
function mineIds(){ try{return JSON.parse(localStorage.getItem('shagiv-mine-ids')||'[]');}catch(e){return[];} }
function addMine(id){ const a=mineIds(); if(id&&!a.includes(id)){ a.unshift(id); localStorage.setItem('shagiv-mine-ids', JSON.stringify(a.slice(0,80))); } }
let items=JSON.parse(localStorage.getItem('shagiv-mine-items')||'[]');
function say(t){ note.textContent=t; }
function saveItems(){ localStorage.setItem('shagiv-mine-items', JSON.stringify(items.slice(0,40))); }
function render(){
  list.innerHTML=items.map(it=>'<div class="item">'+(it.video?'<video src="'+it.url+'" poster="'+(it.poster||'')+'" controls playsinline></video>':'<img src="'+it.url+'">')+'<button class="del" data-id="'+it.id+'">מחיקת התמונה שלי</button></div>').join('');
  list.querySelectorAll('.del').forEach(b=>b.onclick=()=>delMine(b.dataset.id));
}
async function delMine(id){
  try{ await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:id})}); }catch(e){}
  items=items.filter(x=>x.id!==id); saveItems(); render();
}
async function imgurImage(file, desc){
  const fd=new FormData(); fd.append('image', file); fd.append('album', HASH); fd.append('description', desc);
  const r=await fetch('https://api.imgur.com/3/upload',{method:'POST', headers:{Authorization:AUTH}, body:fd});
  const j=await r.json();
  if(!j||!j.success||!j.data||!j.data.id) throw new Error((j&&j.data&&j.data.error)||'העלאה נכשלה');
  return j.data;
}
async function imgurVideo(file){
  const fd=new FormData(); fd.append('video', file); fd.append('album', HASH); fd.append('description', owner);
  const r=await fetch('https://api.imgur.com/3/upload',{method:'POST', headers:{Authorization:AUTH}, body:fd});
  const j=await r.json();
  if(!j||!j.success||!j.data||!(j.data.mp4||j.data.link)) throw new Error('imgur video');
  return (j.data.mp4||j.data.link).replace('http://','https://');
}
function frameBlob(){
  const c=document.createElement('canvas');
  c.width=live.videoWidth||640; c.height=live.videoHeight||480;
  const x=c.getContext('2d');
  if(facing==='user'){ x.translate(c.width,0); x.scale(-1,1); }
  if(live.videoWidth) x.drawImage(live,0,0); else { x.fillStyle='#1a2744'; x.fillRect(0,0,c.width,c.height); }
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.8));
}
async function litterbox(file){
  const fd=new FormData();
  fd.append('reqtype','fileupload');
  fd.append('time','72h');
  fd.append('fileToUpload', file);
  const r=await fetch('https://litterbox.catbox.moe/resources/internals/api.php',{method:'POST', body:fd});
  const url=(await r.text()).trim();
  if(!url.startsWith('http')) throw new Error(url||'litterbox');
  return url;
}
async function tmpVideo(file){
  const fd=new FormData(); fd.append('file', file);
  const r=await fetch('https://tmpfiles.org/api/v1/upload',{method:'POST', body:fd});
  const j=await r.json();
  const url=j&&j.data&&j.data.url;
  if(!url) throw new Error('tmpfiles');
  return String(url).replace('http://','https://');
}
async function hostVideo(file){
  const isMp4=/mp4|quicktime/i.test(file.type||'') || /\.mp4$/i.test(file.name||'');
  if(isMp4){ try{ return await imgurVideo(file); }catch(e){} }
  try{ return await litterbox(file); }catch(e){}
  return await tmpVideo(file);
}
async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:true});
    live.srcObject=stream; await live.play();
    live.classList.toggle('front', facing==='user');
    flip.textContent=facing==='user'?'החלף למצלמה אחורית':'החלף לסלפי';
  }catch(e){ say('אשרו הרשאת מצלמה'); }
}
flip.onclick=()=>{ facing=facing==='user'?'environment':'user'; startCamera(); };
document.getElementById('openGal').onclick=()=>gal.click();
document.getElementById('snap').onclick=async()=>{
  if(!live.videoWidth){ await startCamera(); if(!live.videoWidth) return; }
  upload(await frameBlob(),'photo.jpg',false);
};
document.getElementById('rec').onclick=async()=>{
  if(!stream){ await startCamera(); if(!stream) return; }
  if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
  chunks=[];
  const mime=['video/mp4','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  recorder.onstop=async()=>{
    document.getElementById('rec').textContent='הקלט סרטון';
    const type=recorder.mimeType||'video/webm';
    upload(new Blob(chunks,{type}), type.includes('mp4')?'clip.mp4':'clip.webm', true, await frameBlob());
  };
  recorder.start(); document.getElementById('rec').textContent='עצור הקלטה'; say('מקליט...');
};
gal.onchange=()=>{ [...gal.files].forEach(f=>upload(f,f.name,(f.type||'').startsWith('video'))); };
async function upload(blob,name,video,poster){
  if(!blob||!blob.size) return;
  say(video?'מעלה סרטון...':'מעלה תמונה...');
  try{
    let entry;
    if(video){
      const url=await hostVideo(new File([blob],name,{type:blob.type||'video/webm'}));
      const thumb=poster||await frameBlob();
      const data=await imgurImage(new File([thumb],'poster.jpg',{type:'image/jpeg'}), 'VID|'+owner+'|'+url);
      entry={id:data.id,url,poster:data.link,video:true,owner};
    } else {
      const data=await imgurImage(new File([blob],name,{type:blob.type||'image/jpeg'}), owner);
      entry={id:data.id,url:data.link,video:false,owner};
    }
    addMine(entry.id); items.unshift(entry); saveItems(); render();
    say('נשמר באלבום. סרטון נשמר כ-72 שעות');
  }catch(e){ say('העלאה נכשלה: '+(e.message||e)); }
}
render(); startCamera();
</script>
</body></html>
