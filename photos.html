<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>צילום לאלבום · שגיב</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; }
    .card { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; font-size:22px; }
    p { text-align:center; color:#5a5346; }
    video#live { width:100%; border-radius:16px; background:#000; min-height:220px; object-fit:cover; transform:scaleX(-1); }
    .row { display:flex; gap:8px; margin-top:10px; }
    button,.back { flex:1; border:0; border-radius:14px; padding:14px 8px; font-weight:800; }
    .cam { background:#1a2744; color:#f3e7b8; }
    .gal { background:#c9a227; color:#1a2744; }
    .rec { background:#7a2e2e; color:#fff; }
    .del { background:#eee; color:#7a2e2e; width:100%; margin-top:8px; }
    .back { display:block; text-align:center; text-decoration:none; background:#fff; color:#1a2744; margin-top:12px; }
    .hidden { position:absolute; opacity:0; width:1px; height:1px; }
    #note { min-height:22px; text-align:center; font-weight:700; }
    .item { background:#fff; border-radius:12px; padding:8px; margin-top:8px; text-align:center; }
    .item img,.item video { width:100%; max-height:240px; object-fit:cover; border-radius:8px; background:#ddd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>צילום לאלבום</h1>
    <p>אחרי ההעלאה זה נכנס לאלבום של כולם</p>
    <video id="live" playsinline autoplay muted></video>
    <div class="row">
      <button class="cam" id="startCam" type="button">הפעלת מצלמה</button>
      <button class="cam" id="snap" type="button">צלם והעלה</button>
    </div>
    <div class="row">
      <button class="rec" id="rec" type="button">הקלט סרטון</button>
      <button class="gal" id="openGal" type="button">מהגלריה</button>
    </div>
    <input id="gal" class="hidden" type="file" accept="image/*,video/*" multiple />
    <p id="note"></p>
    <div id="list"></div>
    <a class="back" href="album.html">לאלבום המשותף</a>
    <a class="back" href="./">חזרה</a>
  </div>
  <script>
    const live=document.getElementById('live'), note=document.getElementById('note'), list=document.getElementById('list'), gal=document.getElementById('gal');
    let stream=null, recorder=null, chunks=[], items=[];
    function say(t){ note.textContent=t; }
    function render(){
      list.innerHTML=items.map(it=>{
        const media=it.video?('<video src="'+it.url+'" controls playsinline></video>'):('<img src="'+it.url+'" alt="">');
        return '<div class="item">'+media+'</div>';
      }).join('') || '';
    }
    async function hostFile(file, video){
      const fd=new FormData();
      fd.append(video?'video':'image', file);
      fd.append('album','zlu4GEWHMh6vEso');
      const r=await fetch('https://api.imgur.com/3/upload', {
        method:'POST',
        headers:{ 'Authorization':'Client-ID 546c25a59c58ad7' },
        body:fd
      });
      const j=await r.json();
      if(!j || !j.success || !j.data || !j.data.link) throw new Error((j && j.data && j.data.error) || 'העלאה נכשלה');
      return j.data.link.replace('http://','https://');
    }
    async function startCamera(){
      try{
        if(stream) stream.getTracks().forEach(t=>t.stop());
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
        live.srcObject=stream; await live.play(); say('מצלמת סלפי פעילה');
      }catch(e){ say('אשרו הרשאת מצלמה'); }
    }
    document.getElementById('startCam').onclick=startCamera;
    document.getElementById('openGal').onclick=()=>gal.click();
    document.getElementById('snap').onclick=async()=>{
      if(!live.videoWidth){ await startCamera(); if(!live.videoWidth) return; }
      const c=document.createElement('canvas');
      c.width=live.videoWidth; c.height=live.videoHeight;
      const ctx=c.getContext('2d'); ctx.translate(c.width,0); ctx.scale(-1,1); ctx.drawImage(live,0,0);
      const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
      upload(blob,'selfie.jpg',false);
    };
    document.getElementById('rec').onclick=async()=>{
      if(!stream){ await startCamera(); if(!stream) return; }
      if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
      chunks=[];
      recorder=new MediaRecorder(stream);
      recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{ const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}); upload(blob,'clip.mp4',true); document.getElementById('rec').textContent='הקלט סרטון'; };
      recorder.start(); document.getElementById('rec').textContent='עצור הקלטה'; say('מקליט...');
    };
    gal.onchange=()=>{ [...gal.files].forEach(f=>upload(f,f.name,(f.type||'').startsWith('video'))); };
    async function upload(blob, name, video){
      if(!blob || !blob.size){ say('אין קובץ'); return; }
      say('מעלה לאלבום המשותף...');
      try{
        const file=new File([blob], name, {type: blob.type || (video?'video/mp4':'image/jpeg')});
        const url=await hostFile(file, video);
        items.unshift({url, video:!!video});
        render();
        say('התמונה באלבום של כולם');
      }catch(e){ say('העלאה נכשלה: '+(e.message||e)); }
    }
    startCamera();
  </script>
</body>
</html>
