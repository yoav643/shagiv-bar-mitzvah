<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>תמונות וסרטונים · שגיב</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; color:#2a2418; }
    .card { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; font-size:22px; margin:4px 0 8px; }
    p { text-align:center; color:#5a5346; }
    video#live { width:100%; border-radius:16px; background:#000; min-height:220px; object-fit:cover; }
    .row { display:flex; gap:8px; margin-top:10px; }
    button, .back { flex:1; border:0; border-radius:14px; padding:14px 8px; font-weight:800; font-size:15px; cursor:pointer; }
    .cam { background:#1a2744; color:#f3e7b8; }
    .gal { background:#c9a227; color:#1a2744; }
    .rec { background:#7a2e2e; color:#fff; }
    .back { display:block; text-align:center; text-decoration:none; background:#fff; color:#1a2744; margin-top:12px; }
    .hidden { position:absolute; opacity:0; width:1px; height:1px; }
    #note { min-height:22px; text-align:center; font-size:14px; font-weight:700; }
    .item { background:#fff; border-radius:12px; padding:8px; margin-top:8px; text-align:center; }
    .item img, .item video { width:100%; border-radius:8px; max-height:180px; object-fit:cover; }
    .item a { display:block; margin-top:6px; font-size:13px; word-break:break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>תמונות וסרטונים</h1>
    <p>המצלמה נפתחת כאן. אחרי צילום הקובץ עולה אוטומטית.</p>
    <video id="live" playsinline autoplay muted></video>
    <div class="row">
      <button class="cam" id="startCam" type="button">הפעלת מצלמה</button>
      <button class="cam" id="snap" type="button">צלם</button>
    </div>
    <div class="row">
      <button class="rec" id="rec" type="button">הקלט סרטון</button>
      <button class="gal" id="openGal" type="button">מהגלריה</button>
    </div>
    <input id="gal" class="hidden" type="file" accept="image/*,video/*" multiple />
    <p id="note"></p>
    <div id="list"></div>
    <a class="back" href="./">חזרה לאתר האירוע</a>
  </div>
  <script>
    const live=document.getElementById('live');
    const note=document.getElementById('note');
    const list=document.getElementById('list');
    const gal=document.getElementById('gal');
    let stream=null, recorder=null, chunks=[];
    function say(t){ note.textContent=t; }
    async function startCamera(){
      try{
        if(stream) stream.getTracks().forEach(t=>t.stop());
        stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:true });
        live.srcObject=stream; await live.play(); say('המצלמה פעילה');
      }catch(e){
        try{
          stream=await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
          live.srcObject=stream; await live.play(); say('המצלמה פעילה');
        }catch(err){ say('אשרו הרשאת מצלמה או בחרו מהגלריה.'); }
      }
    }
    document.getElementById('startCam').onclick=startCamera;
    document.getElementById('openGal').onclick=()=>gal.click();
    document.getElementById('snap').onclick=async()=>{
      if(!live.videoWidth){ await startCamera(); return; }
      const c=document.createElement('canvas');
      c.width=live.videoWidth; c.height=live.videoHeight;
      c.getContext('2d').drawImage(live,0,0);
      c.toBlob(blob=>upload(blob,'photo-'+Date.now()+'.jpg'),'image/jpeg',0.88);
    };
    document.getElementById('rec').onclick=async()=>{
      if(!stream){ await startCamera(); if(!stream) return; }
      if(recorder && recorder.state==='recording'){ recorder.stop(); return; }
      chunks=[];
      recorder=new MediaRecorder(stream);
      recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{ const blob=new Blob(chunks,{ type: recorder.mimeType || 'video/webm' }); upload(blob,'video-'+Date.now()+'.webm'); document.getElementById('rec').textContent='הקלט סרטון'; };
      recorder.start();
      document.getElementById('rec').textContent='עצור הקלטה';
      say('מקליט...');
    };
    gal.onchange=()=>{ [...gal.files].forEach(f=>upload(f,f.name)); };
    async function upload(blob, name){
      say('מעלה את '+name+'...');
      const fd=new FormData(); fd.append('file', blob, name);
      try{
        const res=await fetch('https://tmpfiles.org/api/v1/upload',{ method:'POST', body:fd });
        const data=await res.json();
        if(data.status!=='success' || !data.data || !data.data.url){ say('ההעלאה נכשלה, נסו שוב'); return; }
        const url=String(data.data.url).replace('tmpfiles.org/','tmpfiles.org/dl/');
        const isVid=/\.(mp4|webm|mov)$/i.test(name) || (blob.type||'').startsWith('video');
        const preview=isVid?'<video src="'+url+'" controls></video>':'<img src="'+url+'" alt="">';
        list.insertAdjacentHTML('afterbegin', '<div class="item">'+preview+'<a href="'+url+'" target="_blank" rel="noopener">הקובץ עלה</a></div>');
        say('הקובץ עלה בהצלחה');
      }catch(e){ say('לא הצלחנו להעלות. בדקו רשת ונסו שוב.'); }
    }
    startCamera();
  </script>
</body>
</html>
