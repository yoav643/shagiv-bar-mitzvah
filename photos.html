<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>שיתוף תמונות וסרטונים</title>
  <style>
    body { font-family: Arial, sans-serif; background:#1a2744; color:#2a2418; margin:0; padding:20px; }
    .card { max-width:420px; margin:0 auto; background:#f7f1e4; border-radius:22px; padding:22px; text-align:center; }
    h1 { color:#1a2744; font-size:22px; }
    p { color:#5a5346; line-height:1.5; }
    input { width:100%; margin:12px 0; }
    button, a.btn { display:block; width:100%; background:#1a2744; color:#f3e7b8; border:0; border-radius:12px; padding:12px; font-weight:800; text-decoration:none; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>תמונות וסרטונים מהערב</h1>
    <p>בחרו תמונה או סרטון מהמצלמה או מהגלריה, ואז לחצו שיתוף כדי לשלוח למשפחה בוואטסאפ.</p>
    <input id="media" type="file" accept="image/*,video/*" multiple />
    <button type="button" id="share">שיתוף</button>
    <p id="note"></p>
    <a class="btn" href="./">חזרה לאתר האירוע</a>
    <a class="btn" href="brachot.html">לברכות המשפחה</a>
  </div>
  <script>
    const media=document.getElementById('media');
    const note=document.getElementById('note');
    document.getElementById('share').onclick=async()=>{
      const files=[...media.files];
      if(!files.length){ note.textContent='בחרו קודם קובץ'; return; }
      try{
        if(navigator.canShare && navigator.canShare({files})){
          await navigator.share({title:'בר המצווה של שגיב', text:'תמונה/סרטון מבר המצווה של שגיב 🎉', files});
          note.textContent='נשלח';
        } else {
          note.textContent='שלחו את הקובץ ידנית מהגלריה בוואטסאפ.';
        }
      }catch(e){ if(e.name!=='AbortError') note.textContent='אפשר לשלוח ידנית מהגלריה.'; }
    };
  </script>
</body>
</html>
