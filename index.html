<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2744" />
  <title>בר המצווה של שגיב פסטינגר — מספר שולחן</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2744;
      --navy-soft: #243556;
      --gold: #c9a227;
      --gold-light: #e8d48b;
      --cream: #f7f1e4;
      --cream-deep: #efe6d4;
      --ink: #2a2418;
      --white: #fffdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at top, #2c3d62 0%, var(--navy) 55%, #10182a 100%);
      color: var(--ink);
      font-family: "Assistant", "Segoe UI", Tahoma, sans-serif;
    }
    body { display: flex; justify-content: center; padding: 18px 12px 40px; }
    .phone {
      width: 100%; max-width: 420px; background: var(--cream); border-radius: 28px; overflow: hidden;
      box-shadow: 0 0 0 8px var(--navy), 0 24px 60px rgba(0,0,0,.45); position: relative;
    }
    .top {
      position: relative; text-align: center; padding: 28px 24px 18px;
      background: linear-gradient(180deg, rgba(26,39,68,.08) 0%, transparent 40%), var(--cream);
    }
    .garland { font-size: 28px; letter-spacing: 2px; line-height: 1.2; }
    .stars { color: var(--gold); font-size: 11px; letter-spacing: 8px; margin: 6px 0 10px; opacity: .85; }
    .badge {
      width: 86px; height: 86px; margin: 4px auto 12px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3a5280, #1a2744 70%);
      color: #f3e7b8; display: flex; align-items: center; justify-content: center;
      font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 42px;
      box-shadow: 0 8px 20px rgba(26,39,68,.28), inset 0 1px 0 rgba(255,255,255,.2);
      border: 3px solid var(--gold-light);
    }
    .kicker { font-size: 15px; color: #4a4336; line-height: 1.55; padding: 0 8px; }
    h1 { font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 30px; color: var(--navy); margin: 8px 0 4px; }
    .meta { font-size: 14.5px; color: #5a5346; margin-top: 6px; }
    .when {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; background: var(--white);
      border: 1px solid rgba(201,162,39,.35); border-radius: 999px; padding: 7px 14px;
      font-weight: 700; color: var(--navy); font-size: 14px;
    }
    .venue { margin-top: 14px; }
    .venue strong { display: block; font-family: "Frank Ruhl Libre", serif; font-size: 22px; color: var(--navy); }
    .venue span { font-size: 14px; color: #5a5346; }
    .divider { height: 1px; margin: 18px 28px 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .card { padding: 22px 22px 28px; }
    .card h2 { text-align: center; font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .hint { text-align: center; font-size: 13.5px; color: #6b6456; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .input-row { display: flex; gap: 8px; }
    input[type="tel"] {
      flex: 1; font-family: inherit; font-size: 18px; letter-spacing: .5px; padding: 13px 14px;
      border-radius: 14px; border: 1.5px solid #d7cbb3; background: var(--white); color: var(--navy);
      outline: none; direction: ltr; text-align: left;
    }
    input[type="tel"]:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,162,39,.18); }
    button {
      font-family: inherit; font-weight: 800; font-size: 16px; border: 0; border-radius: 14px; padding: 0 18px;
      background: linear-gradient(180deg, #2b3d63, var(--navy)); color: var(--gold-light); cursor: pointer; min-width: 88px;
    }
    button:active { transform: scale(.98); }
    .result { margin-top: 18px; min-height: 80px; }
    .box {
      background: var(--white); border-radius: 18px; padding: 18px 16px; text-align: center;
      border: 1px solid rgba(201,162,39,.3); animation: pop .28s ease;
    }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .box .name { font-weight: 800; font-size: 20px; color: var(--navy); }
    .box .party { font-size: 14px; color: #6b6456; margin-top: 4px; }
    .table-num { margin-top: 12px; font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 56px; line-height: 1; color: var(--navy); }
    .table-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--gold); margin-top: 2px; }
    .error { background: #fff6f2; border-color: #e8b4a4; color: #7a3a2a; font-weight: 700; }
    .footer { text-align: center; font-size: 12.5px; color: #7a7366; padding: 0 20px 8px; }
  </style>
</head>
<body>
  <div class="phone">

      <div class="stars">✦ ✦ ✦ ✦ ✦</div>
      <div class="badge">13</div>
      <p class="kicker">משפחה וחברים יקרים, ברוכים הבאים<br>לאירוע בר המצווה של</p>
      <h1>שגיב פסטינגר</h1>
      <p class="meta">האירוע מתקיים היום · יום חמישי</p>
      <div class="when">📅 &nbsp;19:30 &nbsp;|&nbsp; 27/08/2026</div>
      <div class="venue">
        <strong>אורימא</strong>
        <span>הפלדה 13, באר שבע</span>
      </div>
      <div class="divider"></div>
    </div>
    <div class="card">
      <h2>מה מספר השולחן שלי?</h2>
      <p class="hint">הקלידו את מספר הטלפון שאיתו אושרה ההגעה</p>
      <label for="phone">מספר טלפון</label>
      <div class="input-row">
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0501234567" maxlength="15" />
        <button type="button" id="go">חיפוש</button>
      </div>
      <div class="result" id="result" aria-live="polite"></div>
    </div>
    <p class="footer">נתראה בשמחה · משפחת פסטינגר</p>
  </div>

      { name: "שמש תמי", table: "8", phone: "0522766444", guests: 1 },
      { name: "שרבף דנה", table: "8", phone: "0524713199", guests: 1 },
      { name: "תותחני יאיר", table: "2", phone: "0522509782", guests: 1 }
    ];
    function normalize(raw) {
      if (!raw) return "";
      let d = String(raw).replace(/\D/g, "");
      if (d.startsWith("972")) d = "0" + d.slice(3);
      if (d.length === 9 && !d.startsWith("0")) d = "0" + d;
      return d;
    }
    function guestsLabel(n) {
      n = Number(n) || 1;
      if (n === 1) return "אורח אחד";
      if (n === 2) return "2 אורחים";
      return n + " אורחים";
    }
    function search() {
      const input = document.getElementById("phone").value;
      const out = document.getElementById("result");
      const q = normalize(input);
      if (q.length < 9) {
        out.innerHTML = '<div class="box error">נא להזין מספר טלפון מלא</div>';
        return;
      }
      const hits = GUESTS.filter(g => {
        const p = normalize(g.phone);
        return p === q || p.slice(-9) === q.slice(-9);
      });
      if (!hits.length) {
        out.innerHTML = '<div class="box error">לא מצאנו את המספר ברשימה.<br>נסו מספר אחר או פנו לצוות הקבלה.</div>';
        return;
      }
      out.innerHTML = hits.map(g => `
        <div class="box">
          <div class="name">${g.name}</div>
          <div class="party">${guestsLabel(g.guests)}</div>
          <div class="table-num">${g.table}</div>
          <div class="table-label">מספר שולחן</div>
        </div>
      `).join("");
    }
    document.getElementById("go").addEventListener("click", search);
    document.getElementById("phone").addEventListener("keydown", (e) => {
      if (e.key === "Enter") search();
    });
  </script>
</body>
</html>
