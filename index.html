const TABLE_GROUP={"1":["1","2"],"2":["1","2"],"3":["3","4"],"4":["3","4"]};

function floorMap(hi){hi=groupOf(hi);const rects=Object.keys(TABLES).map(n=>{const t=TABLES[n],on=hi.includes(n);return `<rect class="${on?"tbl-hi":"tbl"}" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="4"/><text class="tbl-txt" x="${t.x+t.w/2}" y="${t.y+t.h/2}">${n}</text>`;}).join("");return `<svg class="floor" viewBox="0 0 280 270">${rects}</svg>`;}
