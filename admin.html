<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול אלבום וברכות</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#1a2744;--gold:#c9a227;--cream:#f7f1e4}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#1a2744;font-family:Assistant,Arial,sans-serif;display:flex;justify-content:center;padding:16px}
    .wrap{width:100%;max-width:440px;background:var(--cream);border-radius:24px;padding:16px}
    h1,h2{text-align:center;color:var(--navy)} h1{font-family:"Frank Ruhl Libre",serif;margin-bottom:8px}
    h2{font-size:18px;margin:16px 0 8px}
    .row{display:flex;gap:8px;margin:8px 0}
    button,.link{border:0;border-radius:12px;padding:12px 8px;font:800 14px Assistant,sans-serif}
    .navy{background:var(--navy);color:#f3e7b8}
    .gold{background:var(--gold);color:var(--navy)}
    .red{background:#7a2e2e;color:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .item{background:#fff;border-radius:12px;overflow:hidden}
    .item img,.item video{width:100%;height:140px;object-fit:cover;display:block;background:#000}
    .wish{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px}
    .wish b{display:block;color:var(--navy);margin-bottom:6px}
    .wish p{white-space:pre-wrap;line-height:1.5;max-height:6em;overflow:hidden}
    .wish textarea,.wish input{width:100%;margin:6px 0;padding:8px;border-radius:10px;border:1px solid #d7cbb3;font:16px Assistant,sans-serif}
    .wish textarea{min-height:120px}
    a.link{display:block;text-align:center;text-decoration:none;margin-top:12px;color:var(--navy)}
    #note{text-align:center;margin-top:8px;color:#5a5346}
  </style>
</head>
<body>
<div class="wrap">
  <h1>ניהול</h1>
  <div class="row">
    <a class="link navy" href="album.html" style="flex:1">אלבום</a>
    <a class="link gold" href="wishes.html" style="flex:1">ברכות</a>
  </div>
  <a class="link gold" href="gifts.html" style="width:100%;margin:0">כסף מהאורחים</a>
  <a class="link navy" href="reviews.html" style="width:100%;margin:8px 0 0">חוות דעת וסטטיסטיקה</a>
  <h2>מי חיפש שולחן</h2>
  <button class="red" id="delLogs" type="button" style="width:100%">מחיקת יומן החיפושים</button>
  <div id="logs"></div>
  <h2>ברכות מאורחים</h2>
  <button class="red" id="delWishes" type="button" style="width:100%">מחיקת כל הברכות</button>
  <div id="wishes"></div>
  <h2>תמונות וסרטונים</h2>
  <button class="red" id="delMedia" type="button" style="width:100%;margin-bottom:8px">מחיקת כל התמונות והסרטונים</button>
  <div id="grid" class="grid"></div>
  <p id="note"></p>
  <a class="link" href="./">חזרה לאתר</a>
</div>
<script>
const ALBUM='LZUxwoK', HASH='zlu4GEWHMh6vEso', AUTH='Client-ID 546c25a59c58ad7';
const wishesBox=document.getElementById('wishes'), grid=document.getElementById('grid'), note=document.getElementById('note'), logsBox=document.getElementById('logs');
let wishes=[], media=[], logs=[];
function parseDesc(d){
  d=String(d||'');
  if(d.startsWith('WISH|')){
    const p=d.split('|');
    let name='', text='';
    try{ name=decodeURIComponent(p[2]||''); text=decodeURIComponent(p.slice(3).join('|')||''); }catch(e){ name=p[2]||''; text=p.slice(3).join('|'); }
    return {type:'wish', owner:p[1]||'', name, text};
  }
  if(d.startsWith('LOG|')){
    const p=d.split('|');
    let name='';
    try{ name=decodeURIComponent(p[2]||''); }catch(e){ name=p[2]||''; }
    return {type:'log', phone:p[1]||'', name, table:p[3]||'', ts:Number(p[4]||0)};
  }
  if(d.startsWith('REV|')||d.startsWith('CASH')) return {type:'skip'};
  if(d.startsWith('VID|')){ const p=d.split('|'); return {type:'video', url:p.slice(2).join('|')}; }
  return {type:'photo'};
}
async function removeId(id){
  await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:{Authorization:AUTH}, body:new URLSearchParams({ids:String(id)})});
}
function wrapLines(ctx, text, maxWidth){
  const lines=[];
  for(const para of String(text||'').split('\n')){
    if(!para){ lines.push(''); continue; }
    let line='';
    for(const w of para.split(' ')){
      const test=line?line+' '+w:w;
      if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w; } else line=test;
    }
    if(line) lines.push(line);
  }
  return lines;
}
function cardBlob(name,text){
  const c=document.createElement('canvas'); const x=c.getContext('2d');
  x.font='28px Assistant,Arial';
  const lines=wrapLines(x,text,780);
  c.width=900; c.height=Math.max(360,130+lines.length*38);
  x.fillStyle='#f7f1e4'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#1a2744'; x.font='bold 36px Assistant,Arial'; x.textAlign='right';
  x.fillText(name||'אורח',860,70);
  x.fillStyle='#5a5346'; x.font='28px Assistant,Arial';
  lines.forEach((ln,i)=>x.fillText(ln,860,130+i*38));
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.86));
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts);
  const p=n=>String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes())+' · '+p(d.getDate())+'/'+p(d.getMonth()+1);
}
function draw(){
  logsBox.innerHTML=logs.map(l=>'<div class="wish"><b>'+esc(l.name||'לא ידוע')+'</b><p style="max-height:none">שולחן '+esc(l.table||'-')+' · '+esc(l.phone)+'<br>'+fmtTime(l.ts)+'</p><button class="red delw" data-id="'+l.id+'" style="width:100%;margin-top:8px">מחיקה</button></div>').join('') || '<p style="text-align:center">עדיין אין חיפושים</p>';
  wishesBox.innerHTML=wishes.map(w=>'<div class="wish" data-id="'+w.id+'"><b>'+esc(w.name||'אורח')+'</b>'+(w.text?'<p>'+esc(w.text)+'</p>':(w.img?'<img src="'+w.img+'" alt="" style="width:100%;border-radius:10px">':''))+'<div class="row"><button class="gold edit" data-id="'+w.id+'">עריכה</button><button class="red delw" data-id="'+w.id+'">מחיקה</button></div></div>').join('') || '<p style="text-align:center">אין ברכות</p>';
  grid.innerHTML=media.map(it=>'<div class="item">'+(it.video?'<video src="'+it.url+'" controls playsinline></video>':'<img src="'+it.url+'">')+'<button class="red delm" data-id="'+it.id+'">מחיקה</button></div>').join('') || '<p style="grid-column:1/-1;text-align:center">אין תמונות</p>';
  wishesBox.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editWish(b.dataset.id));
  wishesBox.querySelectorAll('.delw').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
  logsBox.querySelectorAll('.delw').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
  grid.querySelectorAll('.delm').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
  note.textContent=logs.length+' חיפושים · '+wishes.length+' ברכות · '+media.length+' מדיה';
}
function editWish(id){
  const w=wishes.find(x=>x.id===id); if(!w) return;
  const box=wishesBox.querySelector('[data-id="'+id+'"]');
  box.innerHTML='<input id="en'+id+'" value="'+esc(w.name||'')+'" /><textarea id="et'+id+'">'+esc(w.text||'')+'</textarea><div class="row"><button class="gold" id="sv'+id+'">שמירה</button><button class="navy" id="cn'+id+'">ביטול</button></div>';
  document.getElementById('cn'+id).onclick=draw;
  document.getElementById('sv'+id).onclick=()=>saveWish(id, w.owner);
}
async function saveWish(id, owner){
  const name=document.getElementById('en'+id).value.trim();
  const text=document.getElementById('et'+id).value.trim();
  if(!name||!text) return;
  note.textContent='שומר עריכה...';
  try{
    await removeId(id);
    const blob=await cardBlob(name,text);
    const fd=new FormData();
    fd.append('image', new File([blob],'wish.jpg',{type:'image/jpeg'}));
    fd.append('album', HASH);
    fd.append('description', 'WISH|'+(owner||'admin')+'|'+encodeURIComponent(name)+'|'+encodeURIComponent(text));
    const r=await fetch('https://api.imgur.com/3/upload',{method:'POST', headers:{Authorization:AUTH}, body:fd});
    const j=await r.json();
    if(!j||!j.success) throw new Error('upload');
    note.textContent='הברכה עודכנה';
    setTimeout(load,800);
  }catch(e){ note.textContent='העריכה נכשלה'; }
}
async function delOne(id){
  if(!confirm('למחוק?')) return;
  note.textContent='מוחק...';
  try{ await removeId(id); }catch(e){}
  setTimeout(load,700);
}
async function load(){
  wishes=[]; media=[]; logs=[];
  try{
    const js=await (await fetch('https://api.imgur.com/3/album/'+ALBUM+'/images?t='+Date.now(),{headers:{Authorization:AUTH},cache:'no-store'})).json();
    for(const x of (js.data||[])){
      const m=parseDesc(x.description||x.title||'');
      if(m.type==='wish') wishes.push({id:x.id,name:m.name,text:m.text,owner:m.owner,img:x.link});
      else if(m.type==='log') logs.push({id:x.id,phone:m.phone,name:m.name,table:m.table,ts:m.ts});
      else if(m.type!=='skip') media.push({id:x.id,url:m.type==='video'?(m.url||x.link):x.link,video:m.type==='video'});
    }
  }catch(e){}
  logs.sort((a,b)=>(b.ts||0)-(a.ts||0));
  draw();
}
async function delList(list){
  for(const it of list){ try{ await removeId(it.id); }catch(e){} }
}
document.getElementById('delWishes').onclick=async()=>{ if(!confirm('למחוק את כל הברכות?')) return; note.textContent='מוחק ברכות...'; await delList(wishes.slice()); setTimeout(load,1000); };
document.getElementById('delMedia').onclick=async()=>{ if(!confirm('למחוק את כל התמונות והסרטונים?')) return; note.textContent='מוחק מדיה...'; await delList(media.slice()); setTimeout(load,1000); };
document.getElementById('delLogs').onclick=async()=>{ if(!confirm('למחוק את יומן החיפושים?')) return; note.textContent='מוחק יומן...'; await delList(logs.slice()); setTimeout(load,1000); };
load();
</script>
</body></html>
