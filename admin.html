<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול אלבום</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#1a2744; }
    .wrap { max-width:440px; margin:16px auto; background:#f7f1e4; border-radius:24px; padding:16px; }
    h1 { text-align:center; color:#1a2744; }
    p { text-align:center; color:#5a5346; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .item { background:#fff; border-radius:12px; overflow:hidden; }
    .item img, .item video { width:100%; height:150px; object-fit:cover; display:block; background:#ddd; }
    button { width:100%; border:0; padding:10px; font-weight:800; background:#7a2e2e; color:#fff; }
    .all { margin:10px 0; background:#1a2744; color:#f3e7b8; border:0; border-radius:12px; padding:14px; font-weight:800; width:100%; }
    a { display:block; text-align:center; margin-top:12px; color:#1a2744; font-weight:800; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ניהול האלבום</h1>
    <p>דף פרטי למשפחה · מחיקה מוציאה את התמונה מהאלבום</p>
    <button class="all" id="delAll" type="button">מחיקת כל התמונות</button>
    <div id="grid" class="grid"></div>
    <p id="note"></p>
    <a href="album.html">חזרה לאלבום</a>
  </div>
  <script>
    const ALBUM_ID='LZUxwoK';
    const HASH='zlu4GEWHMh6vEso';
    const AUTH={Authorization:'Client-ID 546c25a59c58ad7'};
    const grid=document.getElementById('grid');
    const note=document.getElementById('note');
    let items=[];
    function say(t){ note.textContent=t; }
    async function load(){
      const res=await fetch('https://api.imgur.com/3/album/'+ALBUM_ID+'/images?t='+Date.now(),{headers:AUTH,cache:'no-store'});
      const data=await res.json();
      items=(data.data||[]).map(x=>({id:x.id,url:x.link,video:String(x.type||'').startsWith('video')||!!x.mp4}));
      if(!items.length){ grid.innerHTML='<p>האלבום ריק</p>'; say(''); return; }
      grid.innerHTML=items.map(it=>'<div class="item">'+(it.video?'<video src="'+it.url+'" controls playsinline></video>':'<img src="'+it.url+'" alt="">')+'<button data-id="'+it.id+'">מחיקה</button></div>').join('');
      grid.querySelectorAll('button').forEach(b=>b.onclick=()=>delOne(b.dataset.id));
      say(items.length+' תמונות');
    }
    async function delOne(id){
      if(!confirm('למחוק את התמונה מהאלבום?')) return;
      say('מוחק...');
      try{
        await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:AUTH, body:new URLSearchParams({ids:id})});
        await fetch('https://api.imgur.com/3/image/'+id,{method:'DELETE', headers:AUTH});
      }catch(e){}
      setTimeout(load, 800);
    }
    document.getElementById('delAll').onclick=async()=>{
      if(!confirm('למחוק את כל התמונות מהאלבום?')) return;
      say('מוחק הכל...');
      const ids=items.map(x=>x.id).join(',');
      try{
        await fetch('https://api.imgur.com/3/album/'+HASH+'/remove_images',{method:'POST', headers:AUTH, body:new URLSearchParams({ids})});
      }catch(e){}
      setTimeout(load, 800);
    };
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
